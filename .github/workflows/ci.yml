name: MATLAB Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest

      # Persist the build tool's incremental build state so tasks whose
      # inputs haven't changed are skipped as up to date.
      - name: Cache MATLAB build tool state
        uses: actions/cache@v4
        with:
          path: .buildtool
          key: buildtool-${{ runner.os }}-${{ hashFiles('buildfile.m', 'src/**', 'tests/**') }}
          restore-keys: |
            buildtool-${{ runner.os }}-

      - name: Run MATLAB build
        uses: matlab-actions/run-build@v3
        with:
          tasks: check test
